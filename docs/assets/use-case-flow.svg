  <rect x="1280" y="530" width="230" height="170" rx="28" class="green"/><text x="1310" y="578" class="h">Proof Lane</text><text x="1310" y="616" class="p">pytest</text><text x="1310" y="644" class="p">CI</text><text x="1310" y="672" class="p">schemas</text>
