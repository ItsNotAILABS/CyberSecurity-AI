  <rect x="1240" y="190" width="290" height="150" rx="28" class="gold"/><text x="1270" y="238" class="h">CHIMERIA Bridge</text><text x="1270" y="274" class="p">approved manifest</text><text x="1270" y="302" class="p">safe fields only</text><text x="1270" y="330" class="p">trunk remains private</text>

  <path d="M360 265 C390 265 410 265 440 265" class="line"/><path d="M750 265 C785 265 800 265 830 265" class="line"/><path d="M1160 265 C1190 265 1210 265 1240 265" class="line"/>

