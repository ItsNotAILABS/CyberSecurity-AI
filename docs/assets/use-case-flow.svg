<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CyberSecurity-AI real use case flow">
  <defs>
    <radialGradient id="r" cx="25%" cy="15%" r="80%"><stop offset="0" stop-color="#1d4ed8"/><stop offset=".5" stop-color="#020617"/><stop offset="1" stop-color="#020617"/></radialGradient>
    <linearGradient id="b" x1="0" x2="1"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0,0 L0,8 L12,4 z" fill="#93c5fd"/></marker>
    <style>.t{font:800 46px Inter,Segoe UI,Arial;fill:#f8fafc}.s{font:600 21px Inter,Segoe UI,Arial;fill:#bfdbfe}.h{font:800 24px Inter,Segoe UI,Arial;fill:#f8fafc}.p{font:500 17px Inter,Segoe UI,Arial;fill:#cbd5e1}.box{fill:url(#b);stroke:#38bdf8;stroke-width:2}.green{fill:#052e16;stroke:#22c55e;stroke-width:2}.gold{fill:#1c1917;stroke:#f59e0b;stroke-width:2}.line{stroke:#93c5fd;stroke-width:3;fill:none;marker-end:url(#a)}</style>
