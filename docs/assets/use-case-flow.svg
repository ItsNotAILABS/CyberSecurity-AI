  <rect x="500" y="530" width="310" height="170" rx="28" class="box"/><text x="530" y="578" class="h">CLI Output</text><text x="530" y="616" class="p">cybersecurity-ai demo</text><text x="530" y="644" class="p">capabilities</text><text x="530" y="672" class="p">market packets</text>
